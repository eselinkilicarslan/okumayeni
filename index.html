<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınıf Kitap Okuma Takip Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef0f3; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1a73e8; font-size: 22px; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #495057; }
        input, select, textarea, button { width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #ced4da; font-size: 15px; }
        button { background-color: #1a73e8; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .online { background-color: #d4edda; color: #155724; }
        
        .day-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
        .day-box { background: white; border: 2px solid #dee2e6; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; user-select: none; transition: 0.2s; }
        .day-box.active { background-color: #e6f4ea; border-color: #34a853; color: #137333; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #f1f3f4; color: #3c4043; }
    </style>

    <!-- Firebase SDK Compat Mode -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📚 Okuma Takip Sistemi</h2>
        <span id="roleBadge" class="badge">Öğrenci Modu</span>
    </div>

    <div id="statusBox" class="status-badge online">🌐 Canlı Bulut Bağlantısı Aktif</div>

    <!-- ÖĞRENCİ EKRANI -->
    <div id="studentView">
        <div class="card">
            <div class="form-group">
                <label for="studentSelect">İsminizi Seçiniz:</label>
                <select id="studentSelect" onchange="loadStudentProgress()">
                    <option value="">-- Listeden Adınızı Seçin --</option>
                </select>
            </div>
        </div>

        <div id="studentDetail" style="display: none;">
            <div class="card" style="text-align: center; background: #e8f0fe; border-color: #aecbfa;">
                <h3 id="studentNameDisplay" style="color: #174ea6;">-</h3>
                <p style="margin-top: 8px; font-size: 18px;">
                    Bu Haftaki Okuma Göreviniz: <strong id="assignedPage" style="color: #d93025; font-size: 22px;">-</strong>. Sayfa
                </p>
            </div>

            <div class="card">
                <label>7 Günlük Okuma Onayı (Okuduğunuz Günün Üzerine Tıklayın):</label>
                <div class="day-grid" id="daysContainer"></div>
            </div>
        </div>
    </div>

    <!-- ÖĞRETMEN EKRANI (?mod=ogretmen) -->
    <div id="teacherView" style="display: none;">
        <div class="card">
            <h3>⚙️ Sınıf ve Hafta Ayarları</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                <div class="form-group">
                    <label>Aktif Hafta:</label>
                    <input type="number" id="weekInput" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Öğrenci Sayısı:</label>
                    <input type="number" id="studentCountInput" value="0" readonly>
                </div>
            </div>
            <div class="form-group">
                <label>Öğrenci İsimleri (Her satıra 1 isim yazın):</label>
                <textarea id="studentNamesInput" rows="6" placeholder="1. Öğrenci&#10;2. Öğrenci"></textarea>
            </div>
            <button onclick="saveClassSettings()">Listeyi ve Sınıfı Canlı Kaydet</button>
        </div>

        <div class="card">
            <h3>📊 Canlı Sınıf Takip Tablosu</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Ad Soyad</th>
                            <th>Sayfa</th>
                            <th>Pzt</th><th>Sal</th><th>Çar</th><th>Per</th><th>Cum</th><th>Cmt</th><th>Paz</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTableBody">
                        <tr><td colspan="10">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// !!! BURAYA KENDİ FIREBASE BİLGİLERİNİZİ YAPIŞTIRIN !!!
const firebaseConfig = {
     apiKey: "AIzaSyC47wM4LiwlPeDzUbvh8MDQPOssYmOqfL8",
  authDomain: "okuma-3fc6c.firebaseapp.com",
  projectId: "okuma-3fc6c",
  storageBucket: "okuma-3fc6c.firebasestorage.app",
  messagingSenderId: "557512021017",
  appId: "1:557512021017:web:5956700a9025d16bbe8688",
  measurementId: "G-KDWNQJPX5X"
};

// Firebase Bağlantısını Başlat
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let appData = {
    week: 1,
    students: [],
    progress: {}
};

const urlParams = new URLSearchParams(window.location.search);
const isTeacherMode = urlParams.get('mod') === 'ogretmen';

window.onload = function() {
    if (isTeacherMode) {
        document.getElementById('roleBadge').innerText = "Öğretmen Modu";
        document.getElementById('studentView').style.display = "none";
        document.getElementById('teacherView').style.display = "block";
    } else {
        document.getElementById('roleBadge').innerText = "Öğrenci Ekranı";
        document.getElementById('studentView').style.display = "block";
        document.getElementById('teacherView').style.display = "none";
    }
    
    // Veritabanını Canlı Dinle
    listenCloudData();
};

function listenCloudData() {
    db.collection("okuma_takip").doc("sinif_verisi")
        .onSnapshot((doc) => {
            if (doc.exists) {
                appData = doc.data();
                if (!appData.progress) appData.progress = {};
                
                if (isTeacherMode) {
                    updateTeacherUI();
                } else {
                    populateStudentSelect();
                }
            }
        }, (error) => {
            console.error("Firebase Bağlantı Hatası:", error);
            document.getElementById('statusBox').className = "status-badge";
            document.getElementById('statusBox').style.background = "#f8d7da";
            document.getElementById('statusBox').style.color = "#721c24";
            document.getElementById('statusBox').innerText = "⚠️ Veritabanı İzin Hatası! Kuralları (Rules) Kontrol Edin.";
        });
}

function saveClassSettings() {
    const rawNames = document.getElementById('studentNamesInput').value.trim();
    const names = rawNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    const week = parseInt(document.getElementById('weekInput').value) || 1;

    if (names.length === 0) {
        alert("En az 1 öğrenci ismi girmelisiniz!");
        return;
    }

    appData.students = names;
    appData.week = week;

    db.collection("okuma_takip").doc("sinif_verisi").set(appData)
        .then(() => alert("Sınıf listesi ve ayarlar canlı veritabanına kaydedildi!"))
        .catch(err => alert("Kayıt hatası: " + err.message));
}

function updateTeacherUI() {
    document.getElementById('weekInput').value = appData.week || 1;
    document.getElementById('studentCountInput').value = appData.students ? appData.students.length : 0;
    
    // Textarea'yı sadece odaklanılmamışsa güncelle (yazarken sıfırlanmasın)
    if (document.activeElement !== document.getElementById('studentNamesInput')) {
        document.getElementById('studentNamesInput').value = appData.students ? appData.students.join('\n') : '';
    }

    const tbody = document.getElementById('teacherTableBody');
    tbody.innerHTML = '';

    if (!appData.students || appData.students.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10">Henüz öğrenci eklenmedi.</td></tr>';
        return;
    }

    const totalStudents = appData.students.length;
    const startPage = ((appData.week - 1) * totalStudents) + 1;

    appData.students.forEach((name, index) => {
        const studentPage = startPage + index;
        const studentProgress = (appData.progress && appData.progress[index]) ? appData.progress[index] : Array(7).fill(false);

        let row = `<tr>
            <td>${index + 1}</td>
            <td><strong>${name}</strong></td>
            <td><span class="badge">Sayfa ${studentPage}</span></td>`;

        for (let d = 0; d < 7; d++) {
            row += `<td>${studentProgress[d] ? '✔' : '-'}</td>`;
        }

        row += `</tr>`;
        tbody.innerHTML += row;
    });
}

function populateStudentSelect() {
    const select = document.getElementById('studentSelect');
    const selectedValue = select.value;
    select.innerHTML = '<option value="">-- Listeden Adınızı Seçin --</option>';

    if (appData.students) {
        appData.students.forEach((name, index) => {
            select.innerHTML += `<option value="${index}">${index + 1}. ${name}</option>`;
        });
    }

    select.value = selectedValue;
    if (selectedValue !== "") {
        loadStudentProgress();
    }
}

function loadStudentProgress() {
    const select = document.getElementById('studentSelect');
    const index = select.value;
    const detailDiv = document.getElementById('studentDetail');

    if (index === "") {
        detailDiv.style.display = "none";
        return;
    }

    const name = appData.students[index];
    const totalStudents = appData.students.length;
    const assignedPage = ((appData.week - 1) * totalStudents) + parseInt(index) + 1;

    document.getElementById('studentNameDisplay').innerText = name;
    document.getElementById('assignedPage').innerText = assignedPage;

    renderDayBoxes(index);
    detailDiv.style.display = "block";
}

function renderDayBoxes(studentIndex) {
    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';

    const days = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
    if (!appData.progress) appData.progress = {};
    if (!appData.progress[studentIndex]) appData.progress[studentIndex] = Array(7).fill(false);

    days.forEach((day, dIndex) => {
        const isChecked = appData.progress[studentIndex][dIndex];
        const box = document.createElement('div');
        box.className = `day-box ${isChecked ? 'active' : ''}`;
        box.innerText = `${day}\n${isChecked ? '✓ Okundu' : '⚪ Okunmadı'}`;
        
        box.onclick = function() {
            appData.progress[studentIndex][dIndex] = !appData.progress[studentIndex][dIndex];
            
            // Firebase'e Anında Kaydet
            db.collection("okuma_takip").doc("sinif_verisi").set(appData);
        };

        daysContainer.appendChild(box);
    });
}
</script>

</body>
</html>
